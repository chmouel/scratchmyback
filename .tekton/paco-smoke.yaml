apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  name: tests
  annotations:
    pipelinesascode.tekton.dev/on-event: "[pull_request]"
    pipelinesascode.tekton.dev/on-target-branch: "[main]"
    pipelinesascode.tekton.dev/max-keep-runs: "3"
spec:
  taskRunTemplate:
    podTemplate:
      automountServiceAccountToken: false
  pipelineSpec:
    description: Smoke test for Paco
    tasks:
      - name: connectivity
        taskSpec:
          steps:
            - name: check-port
              image: docker.io/library/busybox:1.37.0
              command: ["/bin/sh", "-ec"]
              args:
                - |
                  url=http://port-probe.paco-e2e.svc.cluster.local:8080/
                  nslookup port-probe.paco-e2e.svc.cluster.local
                  if ! wget -T 5 -O- "$url"; then
                    echo "FAIL: DNS resolved, but HTTP could not reach $url"
                    exit 1
                  fi
